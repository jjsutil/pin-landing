name: Deploy to GitHub Pages

# Actions runs here: the account's billing block only affects private repos, and
# this one is public. Action versions follow withastro/action@v6's own README
# (checkout@v7 + deploy-pages@v5). See docs/DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        env:
          GHPAGES: 'true'
          # Repo variable (not a secret: Web3Forms keys are public-by-design).
          # Unset → the forms ship in degraded mode (on-screen confirmation only).
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
