name: Deploy to GitHub Pages

# NOTE: GitHub Actions is billing-blocked on this account (see CONTRIBUTING).
# This workflow is correct but will not run until billing is fixed; the manual
# gh-pages fallback is documented in docs/DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v6
        env:
          GHPAGES: 'true'
          # Repo variable (not a secret: Web3Forms keys are public-by-design).
          # Unset → the forms ship in degraded mode (on-screen confirmation only).
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
